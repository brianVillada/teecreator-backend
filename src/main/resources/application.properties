spring.application.name=teecreator-backend

spring.datasource.url=jdbc:mysql://localhost:3306/teecreator
spring.datasource.username=root
spring.datasource.password=

#Se le quita el permiso a Hibernate de modificar tablas, esto lo hago yo en sql directamente
spring.jpa.hibernate.ddl-auto=validate 
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# Configuracion del modulo Python
teecreator.python.directory=python